<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Salt shaker">
  <!-- Salt pouring from the top -->
  <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1">
    <circle cx="20" cy="6" r="1.4"/>
    <circle cx="28" cy="3" r="1.2"/>
    <circle cx="36" cy="5" r="1.4"/>
    <circle cx="44" cy="2" r="1.2"/>
    <circle cx="32" cy="9" r="1.4"/>
  </g>

  <!-- Shaker cap (metallic) -->
  <rect x="18" y="12" width="28" height="9" rx="2" fill="#9ca3af"/>
  <rect x="18" y="12" width="28" height="3" rx="1.5" fill="#6b7280"/>
  <rect x="18" y="18" width="28" height="2" fill="#4b5563"/>

  <!-- Three cap holes -->
  <circle cx="25" cy="16.5" r="1.1" fill="#1f2937"/>
  <circle cx="32" cy="16.5" r="1.1" fill="#1f2937"/>
  <circle cx="39" cy="16.5" r="1.1" fill="#1f2937"/>

  <!-- Shaker body (cream/white) -->
  <path d="M20 21 H44 V54 a4 4 0 0 1 -4 4 H24 a4 4 0 0 1 -4 -4 Z"
        fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Body highlight -->
  <path d="M23 23 V52" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <path d="M23 23 V52" stroke="#e2e8f0" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>

  <!-- Subtle salt level line inside shaker -->
  <line x1="22" y1="44" x2="42" y2="44" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="1 2" opacity="0.7"/>

  <!-- Teal label band (matches brand color #0f766e) -->
  <rect x="20" y="34" width="24" height="9" fill="#0f766e"/>
  <text x="32" y="41.2" text-anchor="middle"
        font-family="'Trebuchet MS', 'Segoe UI', sans-serif"
        font-size="6.2" font-weight="700" fill="#ffffff" letter-spacing="0.4">SALT</text>

  <!-- Base shadow -->
  <ellipse cx="32" cy="60" rx="14" ry="2" fill="#0f172a" opacity="0.18"/>
</svg>
