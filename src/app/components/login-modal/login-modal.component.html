<div class="modal-backdrop" *ngIf="visible" (click)="close.emit()">
  <div class="modal login-modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Sign in</h3>
      <button class="close-x-btn" type="button" aria-label="Close" (click)="close.emit()">×</button>
    </div>
    <form #authForm="ngForm" (ngSubmit)="submit.emit(authForm)" class="modal-body login-form">
      <p class="hint">
        Sign in with the email and password you set up on the Salt Sister Moms
        Firebase project. Don't have an account? Ask the project owner.
      </p>
      <label class="login-row">
        <span>Email</span>
        <input
          name="authEmail"
          type="email"
          autocomplete="username"
          [ngModel]="email"
          (ngModelChange)="emailChange.emit($event)"
          required
          placeholder="you@example.com" />
      </label>
      <label class="login-row">
        <span>Password</span>
        <input
          name="authPassword"
          type="password"
          autocomplete="current-password"
          [ngModel]="password"
          (ngModelChange)="passwordChange.emit($event)"
          required
          placeholder="Password" />
      </label>
      <div class="login-controls">
        <button class="btn btn-primary" type="submit" [disabled]="busy">
          {{ busy ? 'Signing in…' : 'Sign in' }}
        </button>
        <button class="btn btn-secondary" type="button" (click)="close.emit()">Cancel</button>
      </div>
      <div class="auth-error" *ngIf="error">{{ error }}</div>
    </form>
  </div>
</div>
