<header class="topbar">
  <div class="brand-section">
    <span class="brand-icon" aria-hidden="true">🧂</span>
    <h1 class="brand">Salty Ideas</h1>
  </div>

  <nav class="primary-nav" *ngIf="isAuthenticated">
    <button
      *ngFor="let tab of tabs"
      class="nav-tab"
      type="button"
      [class.active]="mainTab === tab.value"
      (click)="mainTabSelected.emit(tab.value)">
      {{ tab.label }}
    </button>
  </nav>

  <div class="nav-mobile" *ngIf="isAuthenticated" (click)="$event.stopPropagation()">
    <button
      class="nav-mobile-trigger"
      type="button"
      (click)="toggleMenu()"
      aria-haspopup="true"
      [attr.aria-expanded]="menuOpen"
      title="Switch section">
      <span class="nav-mobile-label">{{ activeTabLabel() }}</span>
      <span class="chevron" aria-hidden="true">▾</span>
    </button>
    <div class="nav-mobile-dropdown" *ngIf="menuOpen">
      <button
        *ngFor="let tab of tabs"
        class="dropdown-item"
        type="button"
        [class.active]="mainTab === tab.value"
        (click)="selectTab(tab.value)">
        {{ tab.label }}
      </button>
    </div>
  </div>

  <div class="header-controls">
    <ng-container *ngIf="isAuthenticated; else loggedOut">
      <ng-container *ngIf="mainTab === 'projects'; else otherTab">
        <button class="btn btn-success add-btn" type="button" (click)="newProjectClick.emit()">+ Idea</button>
      </ng-container>
      <ng-template #otherTab>
        <button *ngIf="mainTab === 'inspirations'" class="btn btn-success add-btn" type="button" (click)="newInspirationClick.emit()">+ Inspiration</button>
        <button *ngIf="mainTab === 'sponsors'" class="btn btn-success add-btn" type="button" (click)="newSponsorClick.emit()">+ Sponsor</button>
      </ng-template>
      <span class="who">{{ email }}</span>
      <div class="settings-container" (click)="$event.stopPropagation()">
        <button class="btn btn-icon settings-btn" type="button" (click)="toggleSettings()" title="Settings" aria-label="Settings">⚙</button>
        <div class="settings-dropdown" *ngIf="settingsOpen" (click)="$event.stopPropagation()">
          <button class="dropdown-item" type="button" (click)="onConfiguration()">Configuration</button>
          <button class="dropdown-item" type="button" (click)="onTrash()">Trash</button>
          <button class="dropdown-item" type="button" (click)="onLogout()">Sign out</button>
          <div class="dropdown-version">v{{ version }}</div>
        </div>
      </div>
    </ng-container>
    <ng-template #loggedOut>
      <button class="btn btn-primary" type="button" (click)="loginClick.emit()">Sign in</button>
    </ng-template>
  </div>
</header>

<!-- Backdrop to close settings when clicking outside -->
<div class="settings-backdrop" *ngIf="settingsOpen" (click)="closeSettings()"></div>
<div class="menu-backdrop" *ngIf="menuOpen" (click)="closeMenu()"></div>
